  - {host: careers.qualcomm.com, domain: qualcomm.com, name: Qualcomm}

eightfold_v2:        # <host>/api/apply/v2/jobs?domain=<domain>  (older Eightfold sites)
  - {host: netapp.eightfold.ai, domain: netapp.com, name: NetApp}

jibe:                # <host>/api/jobs  (iCIMS Jibe career sites)
  - {host: careers.amd.com, name: AMD}

talentbrew:          # <host>/search-jobs/results  (Radancy career sites; country_facet 1269750 = India)
  - {host: careers.synopsys.com, country_facet: "1269750", name: Synopsys}

oracle:              # <api>/hcmRestApi/.../recruitingCEJobRequisitions  (Oracle Recruiting Cloud)
  - {api: enterpriseplatform.dell.com, site: CX_1001, country_facet: "300000000471053",
     jobs_page: jobs.dell.com/en/sites/careers, name: Dell}

custom:              # in-house job APIs, one reader each
  - {reader: amazon, name: Amazon}
  - {reader: goldman, name: Goldman Sachs}   # higher.gs.com GraphQL
